<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TG Mini App Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=4.1">
</head>
<body>
    <div id="app">
        <main id="main-content"></main>

        <nav id="bottom-nav">
            <div class="nav-item active" data-tab="shop">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Магазин</span>
            </div>
            <div class="nav-item" data-tab="recommended">
                <span class="nav-icon">✨</span>
                <span class="nav-label">Рекомед.</span>
            </div>
            <div class="nav-item" data-tab="products">
                <span class="nav-icon">📦</span>
                <span class="nav-label">Товары</span>
            </div>
            <div class="nav-item" data-tab="cart">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Корзина</span>
            </div>
            <div class="nav-item" data-tab="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </div>
            <div class="nav-item admin-only" data-tab="admin" style="display: none;">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Админка</span>
            </div>
        </nav>
    </div>

    <div id="product-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js?v=5.7"></script>
</body>
</html>
